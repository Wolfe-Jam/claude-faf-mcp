name: 📡 MCP Registry Publish — sibling one.faf server (DNS)

# Publish ANOTHER one.faf/* server's server.json with THIS repo's DNS key.
# Why: the faf.one DNS key is shared across every one.faf/* server but GitHub
# secrets are per-repo and cannot be read back. A sibling that never received
# the secret (faf-mcp, 2026-09-10) can still be published from here without
# the key ever leaving GitHub. Manual only — nothing fires this on its own.
#
# The inputs reach the shell through the environment, never interpolated into
# a script, and the key reaches scripts/registry-login.mjs through the
# environment, never a command line.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Sibling repo (owner/name) whose server.json to publish'
        required: true
        default: 'Wolfe-Jam/faf-mcp'
      ref:
        description: 'Tag or ref of that repo to publish (server.json version must match)'
        required: true
        default: 'v3.0.0'

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  # sha256 of mcp-publisher_linux_amd64.tar.gz at v1.8.1 (registry_1.8.1_checksums.txt)
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish-sibling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (the login script)
        uses: actions/checkout@v7
        with:
          path: cfm

      - name: Checkout the sibling repo at the release tag
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: sibling

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher && chmod +x ./mcp-publisher

      - name: Verify server.json is one.faf/* and its version matches the ref
        working-directory: sibling
        env:
          REF: ${{ inputs.ref }}
        run: |
          NAME=$(node -p "require('./server.json').name")
          case "$NAME" in one.faf/*) ;; *) echo "::error::server.json name '$NAME' is not one.faf/* — this key cannot publish it"; exit 1;; esac
          TAG="${REF#v}"
          MV=$(node -p "require('./server.json').version")
          [ "$TAG" = "$MV" ] || { echo "::error::server.json $MV != ref $TAG"; exit 1; }
          echo "publishing $NAME $MV"

      - name: Login via DNS (one.faf namespace; the key from the environment)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.FAF_ONE_MCP_PRIVATE_KEY }}
        run: node cfm/scripts/registry-login.mjs --domain faf.one

      - name: Publish to MCP Registry
        working-directory: sibling
        run: ../mcp-publisher publish server.json

      - name: Round-trip verify (version-detail endpoint, publisher-provided receipt lives in server._meta)
        working-directory: sibling
        run: |
          ENC=$(node -p "encodeURIComponent(require('./server.json').name)")
          VER=$(node -p "require('./server.json').version")
          for i in 1 2 3 4 5; do
            OUT=$(curl -s --max-time 20 "https://registry.modelcontextprotocol.io/v0.1/servers/${ENC}/versions/${VER}" | node -e '
              let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);const s=j.server||{};const pp=(s._meta||{})["io.modelcontextprotocol.registry/publisher-provided"]||{};console.log((pp["one.faf/context"]?"ok":"no-ctx")+" "+(s.version||""))}catch{console.log("lag")}})')
            case "$OUT" in
              ok\ *) echo "✅ live + serves one.faf/context — $OUT"; exit 0;;
              no-ctx\ *) echo "⚠️ live but no one.faf/context receipt — $OUT"; exit 0;;
              *) echo "⏳ not consistent yet ($i/5)"; sleep 8;;
            esac
          done
          echo "::warning::registry detail endpoint not consistent after retries — verify manually"
