name: 🏁 Championship CI/CD

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  # The lowest Node in the matrices below — scripts/check-engines.mjs holds
  # package.json engines.node and manifest.json to it.
  NODE_VERSION: '22.x'

jobs:
  # 🔒 Security Check
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

  # 🧪 Test Suite (bun) — runs on the bun runtime; one runtime, no Node matrix.
  # scripts/run-tests.sh runs it through scripts/hermetic-test.mjs: a temp HOME,
  # and the run fails if a test writes into the checkout.
  test:
    name: 🧪 Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # backstop: bound the job so an --isolate epoll hang can't run unbounded
    permissions:
      contents: write  # Required for faf-taf-git auto-commit to taf-receipts branch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (bun)
        shell: bash
        run: |
          set -o pipefail
          sh scripts/run-tests.sh --coverage --coverage-reporter=text --coverage-reporter=lcov 2>&1 | tee /tmp/test-output.txt

      - name: Coverage floor (totals over src/; it only rises)
        run: node scripts/check-coverage.mjs

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Write TAF Receipt
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: Wolfe-Jam/faf-taf-git@v2.2.2
        with:
          test-output-file: /tmp/test-output.txt
          auto-commit: 'true'
          commit-message: 'chore(taf): update .taf receipt [skip ci]'
          target-branch: taf-receipts

  # 🟢 Node Smoke — the server ships to Node users: build it and start the bin
  # on every Node the engines field names, on all three platforms.
  node-smoke:
    name: 🟢 Node Smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke - the main module loads and starts nothing
        run: node -e "require('./dist/src/server.js'); console.log('claude-faf-mcp loads on Node ' + process.version)"

  # 📦 Release verify — what ships: the npm tarball installed and started, and
  # the .mcpb unpacked and started with its own bundled code. The registry
  # publish workflow repeats the .mcpb check on the release asset itself.
  release-verify:
    name: 📦 Release Verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm pack → install → initialize + tools/list + faf_score
        run: node scripts/smoke-package.mjs

      # pack:mcpb is a POSIX shell chain (cp/rm/find); the bundle it builds is
      # plain JavaScript, so building it on ubuntu and macOS covers every host.
      - name: .mcpb pack → unpack → start the bundled server → tools/list + faf_score
        if: runner.os != 'Windows'
        run: node scripts/verify-mcpb.mjs

  # 💎 Code Quality — every step is a gate.
  quality:
    name: 💎 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 🧱 Engine floor gate
        run: npm run check:engines  # engines.node == the lowest Node in every matrix == manifest runtimes

      - name: Lint
        run: npm run lint  # fails on any error, and on more warnings than the ratchet in package.json

      - name: Type Check
        run: npm run type-check

      - name: Derived surfaces are current
        run: node scripts/build-landing.mjs --check

  # 🏗️ Build
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [security, test, quality]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/src/index.js            # the bin (package.json "bin")
          test -f dist/src/server.js           # package.json "main"
          test -f dist/src/handlers/tools.js
          test -f dist/src/handlers/resources.js
          test ! -e dist/src/utils/cli-detector.js   # retired in 6.0.0; prebuild keeps dist clean

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # ⚡ Performance — observability, not a gate: timing on shared runners is
  # noise, so the step may fail without failing the job.
  performance:
    name: ⚡ Performance Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests (observability)
        run: npm run test:performance
        continue-on-error: true

  # Status — the real result of every job, and a failure when a gate failed.
  status:
    name: Status
    runs-on: ubuntu-latest
    needs: [security, test, node-smoke, release-verify, quality, build, performance]
    if: always()

    steps:
      - name: Report every job's result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            let failed = 0;
            for (const [job, v] of Object.entries(needs)) {
              const ok = v.result === "success";
              if (!ok) failed++;
              console.log(`${ok ? "PASS" : "FAIL"}  ${job}: ${v.result}`);
            }
            if (failed) { console.log(`\n${failed} job(s) did not succeed.`); process.exit(1); }
            console.log("\nEvery job succeeded.");
          '
