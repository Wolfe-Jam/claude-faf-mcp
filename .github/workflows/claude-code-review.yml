name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # A Dependabot PR cannot read this repo's Actions secrets — GitHub withholds
    # them from bot-authored runs — so the action fails its own env validation
    # and the PR carries a red that says nothing about the change it proposes.
    # Receipt (faf-cli, 2026-09-23): the last 8 human PRs all passed this
    # workflow and both Dependabot PRs failed on that error alone. A dependency
    # bump is Dependabot's diff to justify, not Claude's.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
