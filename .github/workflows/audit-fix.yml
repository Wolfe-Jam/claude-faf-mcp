name: Weekly Audit Fix

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  issues: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run npm audit fix
        run: npm audit fix || true

      - name: Check for lockfile changes
        id: changes
        run: |
          if git diff --quiet package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push lockfile fix
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: automated npm audit fix (weekly)"
          git push

      - name: Verify high-severity audit is clean
        id: audit
        run: |
          if npm audit --audit-level=high; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue if audit still fails after fix
        if: failure() && steps.audit.outputs.clean == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'npm audit high: needs package.json overrides (weekly gate)';
            const body = [
              '## Automated weekly audit failed',
              '',
              '`npm audit fix` could not clear all **high+** findings.',
              'Likely needs a **transitive override** in `package.json` (same pattern as brace-expansion / hono).',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Next steps',
              '1. Run `npm audit --audit-level=high` locally',
              '2. Pin patched versions under `package.json` → `overrides`',
              '3. `npm install` → re-lock → push',
              '',
              '_Opened by Weekly Audit Fix — do not ignore; CI Security Audit will fail the same way._',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 50,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing on run ${context.runId} (${new Date().toISOString()}).`,
              });
            } else {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['security'],
                });
              } catch (_) {
                // Label may not exist on the repo — still open the issue.
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            }
