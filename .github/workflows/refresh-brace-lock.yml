name: Refresh brace-expansion lockfile

# One-shot: package.json overrides moved, but this runner cannot push the
# lockfile directly. Refresh it, drop this workflow, then dispatch CI.
on:
  push:
    branches:
      - cursor/brace-expansion-pins-420e
    paths:
      - package.json

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/brace-expansion-pins-420e

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update lockfile for overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -f .github/workflows/refresh-brace-lock.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(deps): refresh lockfile for patched brace-expansion"
          git push
          gh workflow run ci.yml --ref cursor/brace-expansion-pins-420e
