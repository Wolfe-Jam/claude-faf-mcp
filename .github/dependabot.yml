# Keep transitive security floors current. CI already fails on
# `npm audit --audit-level=high`; Dependabot + weekly audit-fix
# catch drift before a manual re-run of an old SHA surprises us.
#
# Policy: minor/patch auto-PRs only for noisy toolchain packages.
# Major bumps (eslint 10, typescript 7, @types/node 26, …) are
# deliberate migrations — not weekly drive-by PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "fix(deps)"
    # Prefer security updates; group noisy minors so the board stays readable.
    groups:
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Align @types/node with engines + CI (Node 18/20), not latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
