# Smithery configuration for claude-faf-mcp
# https://smithery.ai/docs/build/project-config/smithery-yaml

name: claude-faf-mcp
description: "Claude FAF — persistent project context for Anthropic Claude via the IANA-registered .faf format. 13 core MCP tools (stdio via npx); hosted URL at mcpaas.live/claude/mcp/v1. Scoring, validation, sync, memory."
icon: https://raw.githubusercontent.com/Wolfe-Jam/claude-faf-mcp/main/assets/icons/faf-icon-256.png

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "claude-faf-mcp@latest"]
    })
