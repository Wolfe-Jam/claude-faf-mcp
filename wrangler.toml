name = "faf-claude"
main = "worker/index.js"
compatibility_date = "2024-12-30"

# claude-faf-mcp web surface — Cloudflare canonical (claude.faf.one)
#
# Workers Assets serves public/, which holds only the landing page
# (public/index.html, written by scripts/build-landing.mjs from package.json
# and project.faf). worker/index.js redirects the MCP paths to the hosted
# endpoint and hands everything else to the assets.
#
# Surfaces (CF canonical; Vercel deprecated):
#   1. claude.faf.one                    — THIS Worker (the landing page)
#   2. mcpaas.live/claude/mcp/v1         — MCP endpoint (Cloudflare, served_by mcpaas-cf)
#   3. faf.one/claude                    — discovery page (SvelteKit route — TODO, 404 today)
#
# Per `ask-before-going-live-website-deploys.md` doctrine, this config is
# staged + committed autonomously; the actual `wrangler deploy` requires
# explicit GO from wolfejam.
#
# Mirrors grok-faf-mcp/wrangler.toml — same pattern, different product.

routes = [
  { pattern = "claude.faf.one", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
